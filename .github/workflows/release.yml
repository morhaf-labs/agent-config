name: Release

on:
  push:
    tags:
      - v*

permissions:
  contents: write

jobs:
  release:
    name: Publish immutable package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: microsoft/apm-action@d723bb64ed70c135bbaf87d126b721dd2dae0439 # v1.10.0
        with:
          apm-version: 0.28.0
          setup-only: true

      # APM action v1.10.0 release mode still expects a tar.gz after APM 0.28.0
      # packs single-plugin repositories as ZIP. Remove this adapter when upstream
      # release mode accepts the ZIP it documents.
      - name: Pack and publish verified release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          apm pack --check-versions --check-clean --json
          apm pack --offline --archive --marketplace none --output dist

          shopt -s nullglob
          bundles=(dist/agent-config-*.zip)
          test "${#bundles[@]}" -eq 1
          bundle="${bundles[0]}"

          python tests/verify_release.py "$bundle"
          sha256sum "$bundle" > "$bundle.sha256"
          bundle_name="${bundle##*/}"
          bundle_sha256="$(cut -d ' ' -f 1 "$bundle.sha256")"
          notes="$(mktemp)"
          printf "## Package\n\n| Bundle | SHA-256 |\n| --- | --- |\n| \`%s\` | \`%s\` |\n\nVerify with \`sha256sum -c %s.sha256\`.\n" \
            "$bundle_name" "$bundle_sha256" "$bundle_name" > "$notes"

          gh release create "$GITHUB_REF_NAME" \
            "$bundle" \
            "$bundle.sha256" \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --notes-file "$notes"
