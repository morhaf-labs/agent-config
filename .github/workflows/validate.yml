name: Validate

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # **Local rather than a caller of the organization's shared workflow-security
  # workflow, and that is the visibility boundary rather than an oversight.** This
  # repository is public, and a public repository cannot call a private reusable
  # workflow at all - the attempt produces a zero-second run with no job and no
  # explanation. The same reason keeps LICENSE, SECURITY.md and the contribution
  # guidance local instead of inherited.
  package:
    name: Package and target validation
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        with:
          version: 2026.8.5
          sha256: ee362b6d96c648e27325a8bc7ee866bde4fffc20c88c777c5eb5c3b5c6f3e226

      - name: Run producer tests
        run: python -m unittest discover -s tests -v

      - name: Validate skill structure
        shell: bash
        run: |
          for skill in .apm/skills/*/; do
            agentskills validate "${skill%/}"
          done

      - name: Audit publishable content
        shell: bash
        run: |
          apm audit --ci --no-policy --no-fail-fast
          while IFS= read -r path; do
            apm audit --file "$path"
          done < <(find .apm -type f -name '*.md' -print)

      - name: Pack and verify release artifact
        shell: bash
        run: |
          pack_dir="$(mktemp -d)"
          install_dir="$(mktemp -d)"
          apm pack --dry-run --marketplace none --verbose
          apm pack --archive --marketplace none --output "$pack_dir"
          shopt -s nullglob
          bundles=("$pack_dir"/agent-config-*.zip)
          test "${#bundles[@]}" -eq 1
          bundle="${bundles[0]}"
          python tests/verify_release.py "$bundle"

          # Unrelated local guidance that installation must leave alone. Written before
          # the install rather than checked after it, because "it was not touched" is
          # only meaningful if it was there to touch.
          mkdir -p "$install_dir/.agents/skills/an-unrelated-local-skill"
          printf 'local guidance this package does not own\n' \
            > "$install_dir/.agents/skills/an-unrelated-local-skill/SKILL.md"
          printf 'local notes\n' > "$install_dir/AGENTS.md"

          apm install "$bundle" --dry-run --target codex,copilot,claude --root "$install_dir" --no-policy
          apm install "$bundle" --target codex,copilot,claude --root "$install_dir" --no-policy

          # Every declared skill, for every supported target.
          for skill in .apm/skills/*/; do
            name="$(basename "${skill%/}")"
            diff -r "$skill" "$install_dir/.agents/skills/$name"
            diff -r "$skill" "$install_dir/.claude/skills/$name"
          done

          grep -qx 'local guidance this package does not own' \
            "$install_dir/.agents/skills/an-unrelated-local-skill/SKILL.md"
          grep -qx 'local notes' "$install_dir/AGENTS.md"

          # Package-owned drift: change an installed file and require the audit to say
          # so. Without this, "no drift" and "the detector never runs" look identical.
          printf '\ndrift\n' >> "$install_dir/.agents/skills/deploy-to-morhaf-vps/SKILL.md"
          if (cd "$install_dir" && apm audit --ci --no-policy --no-fail-fast); then
            echo "::error::drift in a package-owned file was not detected"
            exit 1
          fi

          git diff --exit-code
          test -z "$(git status --short)"
